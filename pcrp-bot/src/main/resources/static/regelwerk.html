<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Regelwerk — Paradise City Roleplay</title>
<style>
  :root{
    --bg:#0c0905;
    --panel:#1c1108;
    --panel2:#241609;
    --orange:#ff7a00;
    --orange2:#ff9d33;
    --orange3:#ffb25c;
    --text:#f5eadd;
    --muted:#c9a37a;
    --border:rgba(255,122,0,.3);
    --glow:0 0 24px rgba(255,122,0,.4);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(255,122,0,.16), transparent 60%),
      radial-gradient(900px 500px at 100% 100%, rgba(255,122,0,.09), transparent 60%),
      var(--bg);
    color:var(--text);
    min-height:100vh;
    line-height:1.6;
  }
  header{
    position:sticky;top:0;z-index:20;
    background:rgba(12,9,5,.93);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border);
    box-shadow:0 6px 24px rgba(0,0,0,.5);
  }
  .header-inner{
    max-width:1080px;margin:0 auto;padding:18px 24px;
    display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  }
  .brand{display:flex;flex-direction:column}
  .brand h1{
    font-size:1.35rem;letter-spacing:2px;text-transform:uppercase;color:var(--orange2);
    text-shadow:0 0 16px rgba(255,122,0,.55);
  }
  .brand span{font-size:.72rem;letter-spacing:3px;color:var(--muted);text-transform:uppercase}
  .btn-edit{
    background:linear-gradient(135deg,var(--orange),#e56700);
    color:#140b02;border:none;font-weight:800;letter-spacing:1px;text-transform:uppercase;
    padding:11px 22px;border-radius:8px;cursor:pointer;font-size:.8rem;
    box-shadow:var(--glow);transition:.2s;
  }
  .btn-edit:hover{transform:translateY(-1px);box-shadow:0 0 30px rgba(255,122,0,.5)}
  .btn-edit.active{background:linear-gradient(135deg,#3a2a16,#2a1d0e);color:var(--orange3);box-shadow:none;border:1px solid var(--border)}
  main{max-width:1080px;margin:0 auto;padding:34px 24px 70px}
  .intro{margin-bottom:30px}
  .intro h2{color:var(--orange2);font-size:1.1rem;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px}
  .intro p{color:var(--muted);max-width:720px;font-size:.92rem}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:22px}
  /* Kategorie-Kasten: Titel + Text */
  .cat{
    background:linear-gradient(180deg,var(--panel2),var(--panel));
    border:1px solid var(--border);border-radius:14px;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,.45);
    transition:.2s;
  }
  .cat:hover{border-color:rgba(255,122,0,.55);box-shadow:var(--glow)}
  .cat-head{
    padding:18px 20px;
    background:linear-gradient(180deg,rgba(255,122,0,.14),rgba(255,122,0,.03));
    border-bottom:1px solid var(--border);
  }
  .cat-head h3{
    color:var(--orange2);font-size:1.08rem;letter-spacing:1px;text-transform:uppercase;
    text-shadow:0 0 12px rgba(255,122,0,.4);
  }
  .cat-body{padding:8px 0}
  .rule{
    padding:13px 20px;
    font-size:.94rem;color:var(--text);
    border-bottom:1px solid rgba(255,122,0,.1);
  }
  .rule:last-child{border-bottom:none}
  .rule .num{color:var(--orange3);font-weight:700;margin-right:8px}
  .no-rules{padding:16px 20px;color:var(--muted);font-size:.9rem}
  .empty{color:var(--muted);text-align:center;padding:50px 20px;font-size:.95rem}
  /* Edit-Modus */
  #editor{display:none;margin-top:26px;padding:22px;border:1px dashed var(--orange);border-radius:14px;background:rgba(255,122,0,.05)}
  #editor.show{display:block}
  #editor h3{color:var(--orange2);text-transform:uppercase;letter-spacing:1px;font-size:.9rem;margin-bottom:16px}
  .edit-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
  input[type=text]{
    flex:1;min-width:200px;background:#0c0905;border:1px solid var(--border);color:var(--text);
    padding:11px 13px;border-radius:8px;font-size:.9rem;outline:none;
  }
  input[type=text]:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(255,122,0,.15)}
  .btn{
    border:none;border-radius:8px;cursor:pointer;font-weight:700;padding:11px 18px;font-size:.85rem;
    letter-spacing:.5px;transition:.15s;white-space:nowrap;
  }
  .btn.add{background:var(--orange);color:#140b02}
  .btn.danger{background:rgba(220,60,40,.85);color:#fff}
  .btn.mini{background:rgba(255,122,0,.15);color:var(--orange3);border:1px solid var(--border);padding:7px 11px;font-size:.78rem}
  .btn.mini.del{background:rgba(220,60,40,.25)}
  .cat .edit-area{margin-top:14px;border-top:1px dashed var(--border);padding:14px 20px;background:rgba(0,0,0,.15)}
  .li-edit{display:flex;gap:8px;align-items:center}
  .li-edit input{flex:1;min-width:0}
  .toast{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
    background:#241609;border:1px solid var(--orange);color:var(--text);
    padding:12px 22px;border-radius:10px;opacity:0;pointer-events:none;transition:.3s;z-index:50;
    box-shadow:var(--glow);font-size:.9rem;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @media(max-width:560px){
    .header-inner{padding:14px 16px}
    main{padding:24px 14px 60px}
    .grid{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="brand">
      <h1>Paradise City Regelwerk</h1>
      <span>Paradise City Roleplay</span>
    </div>
    <button class="btn-edit" id="toggleEdit" onclick="toggleEdit()">✎ Edit</button>
  </div>
</header>

<main>
  <div class="intro">
    <h2>Serverregelwerk</h2>
    <p>Hier findest du alle gültigen Regeln des Servers, übersichtlich in Kategorien sortiert. Halte dich an das Regelwerk — Verstöße werden sanktioniert.</p>
  </div>

  <div class="grid" id="grid"></div>

  <div id="editor">
    <h3>Regelwerk bearbeiten</h3>
    <div class="edit-row">
      <input type="text" id="newCatTitle" placeholder="Neue Kategorie (z. B. Allgemeine Regeln)">
      <button class="btn add" onclick="addCategory()">+ Kategorie</button>
    </div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script src="/ban-guard.js"></script>
<script>
  var DATA = { categories: [] };
  var editing = false;

  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  }); }

  function toast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(function(){ t.classList.remove('show'); }, 2400);
  }

  async function load(){
    try{
      var r = await fetch('/api/regelwerk', {cache:'no-store'});
      var d = await r.json();
      if(d && d.categories) DATA.categories = d.categories;
    }catch(e){}
    render();
  }

  function render(){
    var grid = document.getElementById('grid');
    if(!DATA.categories.length){
      grid.innerHTML = '<div class="empty">Noch keine Regeln hinterlegt. Klicke oben auf <b>Edit</b>, um Kategorien hinzuzufügen.</div>';
      return;
    }
    grid.innerHTML = DATA.categories.map(function(cat, ci){
      var head = editing
        ? '<div class="cat-head"><div class="edit-row" style="margin-bottom:0">' +
            '<input type="text" id="cat-title-' + ci + '" value="' + esc(cat.title) + '">' +
            '<button class="btn add" onclick="renameCategory(\'' + cat.id + '\',' + ci + ')">Speichern</button>' +
          '</div></div>'
        : '<div class="cat-head"><h3>' + esc(cat.title) + '</h3></div>';

      var rules = (cat.texts && cat.texts.length)
        ? cat.texts.map(function(t, ti){
            if(editing){
              return '<div class="rule"><div class="li-edit">' +
                       '<input type="text" class="text-in" data-ci="' + ci + '" data-ti="' + ti + '" value="' + esc(t) + '">' +
                       '<button class="btn mini" title="Speichern" onclick="saveEntry(\'' + cat.id + '\',' + ti + ',' + ci + ')">💾</button>' +
                       '<button class="btn mini del" title="Löschen" onclick="delText(\'' + cat.id + '\',' + ti + ')">✕</button>' +
                     '</div></div>';
            }
            return '<div class="rule"><span class="num">§' + (ti+1) + '</span>' + esc(t) + '</div>';
          }).join('')
        : '<div class="no-rules">Noch keine Einträge.</div>';

      var editArea = editing
        ? '<div class="edit-area">' +
            '<div class="edit-row">' +
              '<input type="text" id="entry-' + ci + '" placeholder="Neuer Regeltext">' +
              '<button class="btn add" onclick="addEntry(\'' + cat.id + '\',' + ci + ')">+ Text</button>' +
            '</div>' +
            '<button class="btn danger" onclick="delCategory(\'' + cat.id + '\')">Kategorie löschen</button>' +
          '</div>'
        : '';

      return '<div class="cat">' + head + '<div class="cat-body">' + rules + '</div>' + editArea + '</div>';
    }).join('');
  }

  function toggleEdit(){
    editing = !editing;
    var b = document.getElementById('toggleEdit');
    b.textContent = editing ? '✓ Fertig' : '✎ Edit';
    b.classList.toggle('active', editing);
    document.getElementById('editor').classList.toggle('show', editing);
    render();
  }

  async function api(path, body){
    var opts = { method: body ? 'POST' : 'GET', headers: {'Content-Type':'application/json'}, cache:'no-store' };
    if(body) opts.body = JSON.stringify(body);
    var r = await fetch(path, opts);
    return await r.json();
  }

  async function addCategory(){
    var inp = document.getElementById('newCatTitle');
    var title = inp.value.trim();
    if(!title){ toast('Bitte einen Titel eingeben.'); return; }
    var d = await api('/api/regelwerk/category', {title: title});
    if(d && d.ok){ DATA.categories = d.categories; inp.value=''; render(); toast('Kategorie hinzugefügt.'); }
    else toast(d && d.error ? d.error : 'Fehler.');
  }

  async function renameCategory(catId, ci){
    var inp = document.getElementById('cat-title-' + ci);
    if(!inp.value.trim()){ toast('Titel darf nicht leer sein.'); return; }
    var d = await api('/api/regelwerk/category/edit', {categoryId: catId, title: inp.value});
    if(d && d.ok){ DATA.categories = d.categories; render(); toast('Titel gespeichert.'); }
    else toast(d && d.error ? d.error : 'Fehler.');
  }

  async function addEntry(catId, ci){
    var inp = document.getElementById('entry-' + ci);
    var text = inp.value.trim();
    if(!text){ toast('Bitte einen Text eingeben.'); return; }
    var d = await api('/api/regelwerk/entry', {categoryId: catId, text: text});
    if(d && d.ok){ DATA.categories = d.categories; render(); toast('Regel hinzugefügt.'); }
    else toast(d && d.error ? d.error : 'Fehler.');
  }

  async function saveEntry(catId, ti, ci){
    var inp = document.querySelector('input.text-in[data-ci="' + ci + '"][data-ti="' + ti + '"]');
    if(!inp || !inp.value.trim()){ toast('Text darf nicht leer sein.'); return; }
    var d = await api('/api/regelwerk/entry/edit', {categoryId: catId, index: ti, text: inp.value});
    if(d && d.ok){ DATA.categories = d.categories; render(); toast('Regel gespeichert.'); }
    else toast(d && d.error ? d.error : 'Fehler.');
  }

  async function delText(catId, index){
    if(!confirm('Diese Regel löschen?')) return;
    var d = await api('/api/regelwerk/delete', {categoryId: catId, index: index});
    if(d && d.ok){ DATA.categories = d.categories; render(); toast('Regel gelöscht.'); }
    else toast(d && d.error ? d.error : 'Fehler.');
  }

  async function delCategory(catId){
    if(!confirm('Ganze Kategorie löschen?')) return;
    var d = await api('/api/regelwerk/delete', {categoryId: catId});
    if(d && d.ok){ DATA.categories = d.categories; render(); toast('Kategorie gelöscht.'); }
    else toast(d && d.error ? d.error : 'Fehler.');
  }

  load();
</script>
</body>
</html>
