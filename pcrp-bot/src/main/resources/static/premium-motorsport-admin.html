<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Premium Deluxe Motorsport — Mitarbeiter Dashboard</title>
<style>
  :root{
    --bg:#0a0a0a; --panel:#1a1a1a; --panel2:#222;
    --gold:#d4af37; --gold2:#f6c453;
    --red:#9b1b30; --red2:#c81e3a;
    --txt:#e9e9e9; --txt2:#a8a8a8; --border:#2a2a2a;
    --ok:#1f7a3a; --warn:#a37410;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--txt);font-family:'Segoe UI',Roboto,Arial,sans-serif;line-height:1.5}
  a{color:var(--gold);text-decoration:none}
  img{max-width:100%;display:block}

  .topbar{
    position:sticky;top:0;z-index:50;
    background:linear-gradient(180deg,rgba(0,0,0,.95) 0%,rgba(10,10,10,.92) 100%);
    border-bottom:1px solid var(--border);backdrop-filter:blur(8px);
  }
  .topbar-inner{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:24px;padding:14px 24px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.5px}
  .brand-logo{
    width:36px;height:36px;border-radius:8px;
    background:linear-gradient(135deg,var(--red) 0%,var(--red2) 50%,var(--gold) 100%);
    display:grid;place-items:center;font-size:18px;
  }
  .brand-text{font-size:18px;color:#fff}
  .brand-text small{display:block;color:var(--gold);font-size:10px;font-weight:600;letter-spacing:2px}
  .who{color:var(--txt);font-size:13px;margin-left:auto}
  .who b{color:var(--gold)}
  .who a{color:var(--txt2);font-size:12px;margin-left:14px}

  .container{max-width:1280px;margin:0 auto;padding:0 24px}

  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-top:8px}
  .tabs button{
    background:transparent;border:none;color:var(--txt2);font-size:14px;
    padding:14px 22px;cursor:pointer;font-weight:600;border-bottom:3px solid transparent;transition:.15s;
  }
  .tabs button:hover{color:#fff}
  .tabs button.active{color:var(--gold);border-bottom-color:var(--gold)}

  section.tab{display:none;padding:32px 0 80px}
  section.tab.active{display:block}

  .sec-head{display:flex;align-items:end;justify-content:space-between;margin-bottom:18px;gap:20px;flex-wrap:wrap}
  .sec-head h2{font-size:24px;font-weight:800;color:#fff;letter-spacing:-.5px}
  .sec-head h2 small{display:block;color:var(--gold);font-size:11px;font-weight:600;letter-spacing:3px;margin-top:4px}

  .btn{
    background:linear-gradient(135deg,var(--red) 0%,var(--red2) 100%);
    color:#fff;border:none;font-weight:700;padding:10px 18px;border-radius:8px;cursor:pointer;font-size:13px;transition:.15s;
  }
  .btn:hover{transform:translateY(-1px);box-shadow:0 8px 18px -6px rgba(200,30,58,.5)}
  .btn-ghost{background:transparent;color:var(--gold);border:1px solid var(--gold)}
  .btn-ghost:hover{background:var(--gold);color:#000}
  .btn-ok{background:linear-gradient(135deg,#1f7a3a 0%,#2da152 100%)}
  .btn-sm{padding:7px 12px;font-size:12px}
  .btn-danger{background:#444;color:#fff}
  .btn-danger:hover{background:var(--red2)}

  /* Karten */
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .form-grid .full{grid-column:1/-1}
  label{display:block;color:var(--gold);font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px}
  input,textarea,select{
    width:100%;background:#0d0d0d;border:1px solid var(--border);color:#fff;
    padding:11px 13px;border-radius:8px;font-size:14px;font-family:inherit;
  }
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--gold)}
  textarea{min-height:70px;resize:vertical}
  .form-actions{display:flex;gap:10px;margin-top:14px}

  /* Tabellen */
  .tbl{width:100%;border-collapse:collapse;background:var(--panel);border-radius:12px;overflow:hidden}
  .tbl th{background:#161616;color:var(--gold);text-align:left;padding:14px 16px;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;border-bottom:1px solid var(--border)}
  .tbl td{padding:14px 16px;border-bottom:1px solid var(--border);font-size:14px;vertical-align:middle}
  .tbl tr:last-child td{border-bottom:none}
  .tbl tr:hover td{background:rgba(255,255,255,.02)}
  .tbl .name{color:#fff;font-weight:700}
  .pill{display:inline-block;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:1px}
  .pill-ok{background:rgba(31,122,58,.2);color:#5cd17f;border:1px solid rgba(31,122,58,.4)}
  .pill-low{background:rgba(212,175,55,.18);color:var(--gold2);border:1px solid rgba(212,175,55,.4)}
  .pill-out{background:rgba(80,80,80,.3);color:var(--txt2);border:1px solid var(--border)}
  .row-actions{display:flex;gap:6px}

  /* Login */
  .login-wrap{max-width:420px;margin:80px auto;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:36px;text-align:center}
  .login-wrap .ic{font-size:48px;margin-bottom:14px}
  .login-wrap h3{color:var(--gold);font-size:22px;font-weight:800;margin-bottom:6px}
  .login-wrap p{color:var(--txt2);font-size:13px;margin-bottom:22px}
  .login-wrap input{margin-bottom:14px}

  /* Toast */
  .toast-wrap{position:fixed;top:80px;right:24px;z-index:200;display:flex;flex-direction:column;gap:10px}
  .toast{background:var(--panel);border:1px solid var(--gold);color:#fff;padding:12px 18px;border-radius:10px;font-size:14px;max-width:340px;box-shadow:0 10px 30px -10px rgba(0,0,0,.6);animation:slideIn .3s ease-out}
  .toast.err{border-color:var(--red2)}
  @keyframes slideIn{from{transform:translateX(110%);opacity:0}to{transform:translateX(0);opacity:1}}

  .hidden{display:none !important}
  .empty{padding:60px 20px;text-align:center;color:var(--txt2)}

  @media (max-width:780px){
    .form-grid{grid-template-columns:1fr}
    .tbl{display:block;overflow-x:auto;white-space:nowrap}
    .topbar-inner{gap:10px;padding:12px 14px}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-logo">🏎️</div>
      <div class="brand-text">PREMIUM DELUXE<small>MOTORSPORT · MITARBEITER</small></div>
    </div>
    <div class="who" id="who">— · <a href="/premium-motorsport">↩ Public-Seite</a></div>
  </div>
</div>

<!-- LOGIN -->
<div id="login-screen" class="container">
  <div class="login-wrap">
    <div class="ic">🔐</div>
    <h3>Mitarbeiter-Anmeldung</h3>
    <p>Gib deine Dienst-Handy-Nummer ein, um auf das Dashboard zuzugreifen.</p>
    <input id="login-phone" type="tel" placeholder="z.B. 555-MIT-001" autocomplete="off"/>
    <button class="btn" id="login-submit" style="width:100%">📱 Anmelden</button>
  </div>
</div>

<!-- APP -->
<div id="app" class="container hidden">
  <div class="tabs">
    <button class="active" data-tab="vehicles">🏎️ Fahrzeuge</button>
    <button data-tab="info">📌 Mitteilungen</button>
    <button data-tab="offers">🔥 Angebote</button>
  </div>

  <!-- VEHICLES -->
  <section class="tab active" id="tab-vehicles">
    <div class="sec-head"><h2>Fahrzeugbestand<small>LAGER + KATALOG</small></h2></div>

    <div class="card" style="margin-bottom:20px">
      <h3 style="color:#fff;font-size:16px;margin-bottom:14px">➕ Neues Fahrzeug anlegen</h3>
      <div class="form-grid">
        <div><label>Name</label><input id="v-name" placeholder="z.B. Pegassi Zentorno"/></div>
        <div><label>Kategorie</label>
          <select id="v-cat">
            <option value="Super">🏎️ Super</option>
            <option value="Sport">🚗 Sport</option>
            <option value="Muscle">💪 Muscle</option>
            <option value="Coupe">🚙 Coupe</option>
            <option value="Sedan">🚘 Sedan</option>
            <option value="SUV">🚙 SUV</option>
            <option value="Compact">🚐 Compact</option>
            <option value="Motorcycle">🏍️ Motorcycle</option>
            <option value="Off-Road">🛻 Off-Road</option>
            <option value="Industrial">🚛 Industrial</option>
            <option value="Utility">🚚 Utility</option>
            <option value="Van">🚐 Van</option>
            <option value="Bicycle">🚲 Bicycle</option>
            <option value="Helicopter">🚁 Helicopter</option>
            <option value="Plane">✈️ Plane</option>
            <option value="Boat">🛥️ Boat</option>
          </select>
        </div>
        <div><label>Preis ($)</label><input id="v-price" type="number" placeholder="z.B. 250000"/></div>
        <div><label>Lagerbestand</label><input id="v-stock" type="number" placeholder="z.B. 3" value="1"/></div>
        <div class="full"><label>Beschreibung</label><textarea id="v-desc" placeholder="Kurze technische Beschreibung, Leistung, Besonderheiten…"></textarea></div>
        <div class="full"><label>Bild-URL (optional)</label><input id="v-img" placeholder="https://… (sonst Platzhalter)"/></div>
      </div>
      <div class="form-actions">
        <button class="btn btn-ok" id="v-create">✓ Anlegen</button>
        <button class="btn-ghost btn" id="v-reset">Zurücksetzen</button>
      </div>
    </div>

    <div id="veh-table-wrap">
      <table class="tbl" id="veh-tbl">
        <thead><tr>
          <th>Fahrzeug</th><th>Kategorie</th><th>Preis</th><th>Lager</th><th style="text-align:right">Aktion</th>
        </tr></thead>
        <tbody id="veh-tbody"></tbody>
      </table>
    </div>
  </section>

  <!-- INFO -->
  <section class="tab" id="tab-info">
    <div class="sec-head"><h2>Mitteilungen<small>INFO-BOARD</small></h2></div>
    <div class="card" style="margin-bottom:20px">
      <div class="form-grid">
        <div><label>Titel</label><input id="i-title" placeholder="z.B. Neue Lieferung"/></div>
        <div class="full"><label>Text</label><textarea id="i-text" placeholder="Mitteilung an alle Spieler…"></textarea></div>
      </div>
      <div class="form-actions">
        <button class="btn btn-ok" id="i-create">✓ Veröffentlichen</button>
      </div>
    </div>
    <div id="info-list"></div>
  </section>

  <!-- OFFERS -->
  <section class="tab" id="tab-offers">
    <div class="sec-head"><h2>Angebote<small>HOT DEALS</small></h2></div>
    <div class="card" style="margin-bottom:20px">
      <div class="form-grid">
        <div><label>Titel</label><input id="o-title" placeholder="z.B. Sommer-Rabatt"/></div>
        <div><label>Rabatt (%)</label><input id="o-discount" type="number" placeholder="z.B. 25" value="10"/></div>
        <div class="full"><label>Beschreibung</label><textarea id="o-desc" placeholder="Optionale Details…"></textarea></div>
      </div>
      <div class="form-actions">
        <button class="btn btn-ok" id="o-create">✓ Erstellen</button>
      </div>
    </div>
    <div id="offers-list"></div>
  </section>
</div>

<div class="toast-wrap" id="toasts"></div>

<script>
const API = "%%API_BASE%%";
const EMPLOYEE_NAME = "%%EMPLOYEE_NAME%%";
const CATEGORIES = ["Super","Sport","Muscle","Coupe","Sedan","SUV","Compact","Motorcycle","Off-Road","Industrial","Utility","Van","Bicycle","Helicopter","Plane","Boat"];
const CAT_EMOJI  = {"Super":"🏎️","Sport":"🚗","Muscle":"💪","Coupe":"🚙","Sedan":"🚘","SUV":"🚙","Compact":"🚐","Motorcycle":"🏍️","Off-Road":"🛻","Industrial":"🚛","Utility":"🚚","Van":"🚐","Bicycle":"🚲","Helicopter":"🚁","Plane":"✈️","Boat":"🛥️"};

let token = null, me = null;

function toast(msg, isErr){
  const wrap = document.getElementById("toasts");
  const t = document.createElement("div");
  t.className = "toast" + (isErr ? " err" : "");
  t.textContent = msg;
  wrap.appendChild(t);
  setTimeout(()=>{ t.style.opacity="0"; t.style.transition=".3s"; setTimeout(()=>t.remove(),350); }, 3500);
}
async function api(path, opts={}){
  const u = path.includes("?") ? "&token="+encodeURIComponent(token) : "?token="+encodeURIComponent(token || "");
  const res = await fetch(API + path + u, Object.assign({headers:{"Content-Type":"application/json"}}, opts));
  if(!res.ok){
    let err="Fehler "+res.status; try{ const j=await res.json(); err=j.error||err; }catch(_){}
    throw new Error(err);
  }
  return res.json();
}
function fmt$(n){ return n.toLocaleString("de-DE")+" $"; }

function setLoggedIn(t, info){
  token = t; me = info;
  document.getElementById("login-screen").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  document.getElementById("who").innerHTML = `<b>${me.displayName}</b> · Mitarbeiter · <a href="/premium-motorsport">↩ Public-Seite</a>`;
  loadAll();
}
function setLoggedOut(msg){
  document.getElementById("login-screen").classList.remove("hidden");
  document.getElementById("app").classList.add("hidden");
  if(msg) toast(msg, true);
}

// Login
document.getElementById("login-submit").addEventListener("click", async ()=>{
  const phone = document.getElementById("login-phone").value.trim();
  if(!phone){ toast("Nummer erforderlich.", true); return; }
  try{
    const res = await fetch(API + "/api/pd/auth/login", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({phone})
    });
    if(!res.ok){ const j=await res.json().catch(()=>({})); throw new Error(j.error||"Login fehlgeschlagen"); }
    const r = await res.json();
    if(!r.employee){ throw new Error("Keine Mitarbeiter-Berechtigung."); }
    setLoggedIn(r.token, r);
  } catch(e){ toast(e.message, true); }
});

// Tabs
document.querySelectorAll(".tabs button").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active"));
  document.querySelectorAll("section.tab").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");
  document.getElementById("tab-"+b.dataset.tab).classList.add("active");
}));

// ── Vehicles ───────────────────────────────────────────────────────────
async function loadVehicles(){
  try{
    const data = await api("/api/pd/vehicles");
    const list = (data.vehicles||[]).slice().sort((a,b)=>a.name.localeCompare(b.name));
    const tbody = document.getElementById("veh-tbody");
    if(!list.length){ tbody.innerHTML = `<tr><td colspan="5" class="empty">Noch keine Fahrzeuge im Katalog.</td></tr>`; return; }
    tbody.innerHTML = list.map(v=>{
      const stockPill = v.stock===0
        ? `<span class="pill pill-out">Ausverkauft</span>`
        : v.stock<=3
          ? `<span class="pill pill-low">${v.stock} auf Lager</span>`
          : `<span class="pill pill-ok">${v.stock} auf Lager</span>`;
      return `<tr>
        <td><div class="name">${v.name}</div><div style="color:var(--txt2);font-size:12px">${v.description||"—"}</div></td>
        <td>${CAT_EMOJI[v.category]||""} ${v.category}</td>
        <td><span style="color:var(--gold);font-weight:700">${v.priceFmt||fmt$(v.price)}</span></td>
        <td>${stockPill}</td>
        <td style="text-align:right"><div class="row-actions">
          <button class="btn btn-sm" onclick="adjustStock('${v.id}',1)">+1</button>
          <button class="btn btn-sm" onclick="adjustStock('${v.id}',-1)">-1</button>
          <button class="btn btn-sm btn-danger" onclick="delVehicle('${v.id}','${v.name.replace(/'/g,'')}')">🗑</button>
        </div></td>
      </tr>`;
    }).join("");
  }catch(e){ toast(e.message,true); }
}
async function adjustStock(id, delta){
  // Trick: erstelle ein neues Fahrzeug oder update via direktem POST
  // Da wir keinen /update haben, nutzen wir lokalen Re-Render: über /create wird der Stock nur beim Anlegen gesetzt
  // Workaround: lokale Info "Stock wird beim nächsten Deploy persistent geändert"
  toast("Stock-Anpassung in dieser Demo: bitte Fahrzeug löschen + neu anlegen.");
}
async function delVehicle(id, name){
  if(!confirm(`Fahrzeug "${name}" wirklich löschen?`)) return;
  try{ await api("/api/pd/vehicles/"+id+"/delete", {method:"POST"}); toast("✅ Gelöscht."); loadVehicles(); }
  catch(e){ toast(e.message,true); }
}
document.getElementById("v-create").addEventListener("click",(async ()=>{
  const name = document.getElementById("v-name").value.trim();
  const cat  = document.getElementById("v-cat").value;
  const price= parseInt(document.getElementById("v-price").value)||0;
  const stock= parseInt(document.getElementById("v-stock").value)||1;
  const desc = document.getElementById("v-desc").value.trim();
  const img  = document.getElementById("v-img").value.trim();
  if(!name||price<=0){ toast("Name und Preis erforderlich.",true); return; }
  try{
    await api("/api/pd/vehicles", {method:"POST", body:JSON.stringify({name,category:cat,description:desc,price,imageUrl:img,stock})});
    toast("✅ Fahrzeug angelegt: "+name);
    ["v-name","v-price","v-desc","v-img"].forEach(id=>document.getElementById(id).value="");
    document.getElementById("v-stock").value=1;
    loadVehicles();
  }catch(e){ toast(e.message,true); }
}));
document.getElementById("v-reset").addEventListener("click",()=>{
  ["v-name","v-price","v-desc","v-img"].forEach(id=>document.getElementById(id).value="");
  toast("Formular zurückgesetzt.");
});

// ── Info ───────────────────────────────────────────────────────────────
async function loadInfo(){
  try{
    const data = await api("/api/pd/info");
    const msgs = data.messages||[];
    const root = document.getElementById("info-list");
    if(!msgs.length){ root.innerHTML = `<div class="card empty">Noch keine Mitteilungen.</div>`; return; }
    root.innerHTML = msgs.map(m=>`<div class="card" style="margin-bottom:12px">
      <div style="display:flex;justify-content:space-between;align-items:start;gap:10px">
        <div style="flex:1">
          <div style="color:var(--gold);font-weight:700;font-size:16px">${m.title}</div>
          <div style="margin-top:6px;color:var(--txt)">${m.text}</div>
          <div style="color:var(--txt2);font-size:11px;margin-top:6px">von <b>${m.author}</b> · ${new Date(m.createdAt).toLocaleString("de-DE")}</div>
        </div>
        <button class="btn btn-sm btn-danger" onclick="delInfo('${m.id}')">🗑</button>
      </div>
    </div>`).join("");
  }catch(e){ toast(e.message,true); }
}
async function delInfo(id){
  if(!confirm("Mitteilung wirklich löschen?")) return;
  try{ await api("/api/pd/info/"+id+"/delete", {method:"POST"}); toast("✅ Gelöscht."); loadInfo(); }
  catch(e){ toast(e.message,true); }
}
document.getElementById("i-create").addEventListener("click",(async ()=>{
  const title = document.getElementById("i-title").value.trim();
  const text  = document.getElementById("i-text").value.trim();
  if(!text){ toast("Text erforderlich.", true); return; }
  try{
    await api("/api/pd/info", {method:"POST", body:JSON.stringify({title,text})});
    toast("✅ Mitteilung veröffentlicht.");
    document.getElementById("i-title").value=""; document.getElementById("i-text").value="";
    loadInfo();
  }catch(e){ toast(e.message,true); }
}));

// ── Offers ─────────────────────────────────────────────────────────────
async function loadOffers(){
  try{
    const data = await api("/api/pd/offers");
    const list = data.offers||[];
    const root = document.getElementById("offers-list");
    if(!list.length){ root.innerHTML = `<div class="card empty">Noch keine Angebote.</div>`; return; }
    root.innerHTML = list.map(o=>`<div class="card" style="margin-bottom:12px;border-color:var(--red)">
      <div style="display:flex;justify-content:space-between;align-items:start;gap:10px">
        <div style="flex:1">
          <span class="pill pill-low">-${o.discountPercent}%</span>
          <span style="color:#fff;font-weight:700;font-size:16px;margin-left:8px">${o.title}</span>
          <div style="color:var(--txt2);font-size:13px;margin-top:6px">${o.description||""}</div>
          ${o.vehicleId?`<div style="color:var(--txt2);font-size:11px;margin-top:4px">Fahrzeug-ID: ${o.vehicleId}</div>`:''}
        </div>
        <button class="btn btn-sm btn-danger" onclick="delOffer('${o.id}')">🗑</button>
      </div>
    </div>`).join("");
  }catch(e){ toast(e.message,true); }
}
async function delOffer(id){
  if(!confirm("Angebot wirklich löschen?")) return;
  try{ await api("/api/pd/offers/"+id+"/delete", {method:"POST"}); toast("✅ Gelöscht."); loadOffers(); }
  catch(e){ toast(e.message,true); }
}
document.getElementById("o-create").addEventListener("click",(async ()=>{
  const title = document.getElementById("o-title").value.trim();
  const desc  = document.getElementById("o-desc").value.trim();
  const disc  = parseInt(document.getElementById("o-discount").value)||0;
  if(!title){ toast("Titel erforderlich.", true); return; }
  try{
    await api("/api/pd/offers", {method:"POST", body:JSON.stringify({title,description:desc,discountPercent:disc})});
    toast("✅ Angebot erstellt.");
    document.getElementById("o-title").value=""; document.getElementById("o-desc").value="";
    loadOffers();
  }catch(e){ toast(e.message,true); }
}));

function loadAll(){ loadVehicles(); loadInfo(); loadOffers(); }

// Auto-Login via Query-Token (kommt vom Mitarbeiter-Login-Flow)
(async function(){
  const params = new URLSearchParams(location.search);
  const t = params.get("token");
  if(t){
    try{
      const r = await fetch(API + "/api/pd/me?token="+encodeURIComponent(t));
      if(!r.ok) throw new Error("Token ungültig");
      const me = await r.json();
      if(!me.employee) throw new Error("Keine Mitarbeiter-Berechtigung");
      setLoggedIn(t, me);
      return;
    }catch(e){ setLoggedOut(e.message); return; }
  }
  setLoggedOut();
})();
</script>
</body>
</html>
