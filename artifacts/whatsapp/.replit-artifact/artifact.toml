kind = "web"
previewPath = "/whatsapp/"
title = "WhatsApp Clone"
version = "1.0.0"
id = "artifacts/whatsapp"
router = "path"

[[services]]
name = "web"
paths = [ "/whatsapp/" ]
localPort = 20356

[services.development]
run = "pnpm --filter @workspace/whatsapp run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/whatsapp", "run", "build" ]
serve = "static"
publicDir = "artifacts/whatsapp/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20356"
BASE_PATH = "/whatsapp/"
